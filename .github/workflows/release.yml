name: Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate VERSION
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\n' < VERSION)"

          version_pattern='^([0-9]{4}\.(0[1-9]|1[0-2])\.(0[1-9]|[12][0-9]|3[01]))(\.[1-9][0-9]*)?$'
          if [[ "$version" =~ $version_pattern ]]; then
            calendar_version="${BASH_REMATCH[1]}"
          else
            echo "VERSION must use YYYY.MM.DD or YYYY.MM.DD.N." >&2
            exit 1
          fi

          parsed="$(date -u -d "${calendar_version//./-}" +%Y.%m.%d 2>/dev/null || true)"
          if [[ "$parsed" != "$calendar_version" ]]; then
            echo "VERSION is not a valid calendar date: $version" >&2
            exit 1
          fi

          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Release tag already exists: $tag" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/quality.yml

  publish:
    name: Publish ${{ matrix.name }}
    needs:
      - validate
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: frontend
            repository: localssh-frontend
            context: .
            file: Dockerfile
          - name: relay
            repository: localssh-relay
            context: relay
            file: relay/Dockerfile
          - name: combined
            repository: localssh
            context: .
            file: Dockerfile.all-in-one
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.repository }}
      COMBINED_IMAGE: ghcr.io/${{ github.repository_owner }}/localssh
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # All three images carry the labels generated for the combined image,
      # as they did when one job built them in sequence.
      - name: Image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.COMBINED_IMAGE }}
          tags: type=raw,value=${{ env.VERSION }}

      - name: Build and publish ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Attest ${{ matrix.name }} image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/${{ matrix.name }}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.name }}
          path: digests/${{ matrix.name }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Promote and release
    needs:
      - validate
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    env:
      FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/localssh-frontend
      RELAY_IMAGE: ghcr.io/${{ github.repository_owner }}/localssh-relay
      COMBINED_IMAGE: ghcr.io/${{ github.repository_owner }}/localssh
      VERSION: ${{ needs.validate.outputs.version }}
      TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote images to latest
        run: |
          set -euo pipefail
          digest_pattern='^sha256:[0-9a-f]{64}$'
          for name in frontend relay combined; do
            digest="$(tr -d '\n' < "digests/$name")"
            if [[ ! "$digest" =~ $digest_pattern ]]; then
              echo "Invalid digest for $name: $digest" >&2
              exit 1
            fi
            declare "${name^^}_DIGEST=$digest"
          done
          docker buildx imagetools create --tag "$FRONTEND_IMAGE:latest" "$FRONTEND_IMAGE@$FRONTEND_DIGEST"
          docker buildx imagetools create --tag "$RELAY_IMAGE:latest" "$RELAY_IMAGE@$RELAY_DIGEST"
          docker buildx imagetools create --tag "$COMBINED_IMAGE:latest" "$COMBINED_IMAGE@$COMBINED_DIGEST"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes
