name: localssh

services:
  localssh:
    image: ghcr.io/bradsec/localssh:latest
    build:
      context: .
      dockerfile: Dockerfile.all-in-one
    restart: unless-stopped
    ports:
      - "127.0.0.1:9080:80"
    # When serving under your own domain, allow its page hostname explicitly.
    # Matching Origin and Host alone permits DNS rebinding.
    # environment:
    #   PUBLIC_HOSTS: app.example.com
