name: Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate VERSION
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\n' < VERSION)"

          version_pattern='^([0-9]{4}\.(0[1-9]|1[0-2])\.(0[1-9]|[12][0-9]|3[01]))(\.[1-9][0-9]*)?$'
          if [[ "$version" =~ $version_pattern ]]; then
            calendar_version="${BASH_REMATCH[1]}"
          else
            echo "VERSION must use YYYY.MM.DD or YYYY.MM.DD.N." >&2
            exit 1
          fi

          parsed="$(date -u -d "${calendar_version//./-}" +%Y.%m.%d 2>/dev/null || true)"
          if [[ "$parsed" != "$calendar_version" ]]; then
            echo "VERSION is not a valid calendar date: $version" >&2
            exit 1
          fi

          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Release tag already exists: $tag" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            relay/package-lock.json

      - name: Test engine
        working-directory: engine
        run: |
          go test ./...
          go test -race ./...
          GOOS=js GOARCH=wasm go vet ./...
          ./build.sh
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...
          GOOS=js GOARCH=wasm "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Test relay
        working-directory: relay
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          npm run lint
          npm run format:check
          npm run build

      - name: Test frontend
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          npm run lint
          npm run format:check
          npx tsc -b
          npm run build

      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        working-directory: frontend
        run: E2E_COMBINED=1 npm run test:e2e

  publish:
    name: Publish release
    needs:
      - validate
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    env:
      FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/localssh-frontend
      RELAY_IMAGE: ghcr.io/${{ github.repository_owner }}/localssh-relay
      COMBINED_IMAGE: ghcr.io/${{ github.repository_owner }}/localssh
      VERSION: ${{ needs.validate.outputs.version }}
      TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.COMBINED_IMAGE }}
          tags: type=raw,value=${{ env.VERSION }}

      - name: Build and publish frontend
        id: frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.VERSION }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Attest frontend image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.FRONTEND_IMAGE }}
          subject-digest: ${{ steps.frontend.outputs.digest }}
          push-to-registry: true

      - name: Build and publish relay
        id: relay
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: relay
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.RELAY_IMAGE }}:${{ env.VERSION }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=relay
          cache-to: type=gha,mode=max,scope=relay

      - name: Attest relay image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.RELAY_IMAGE }}
          subject-digest: ${{ steps.relay.outputs.digest }}
          push-to-registry: true

      - name: Build and publish combined image
        id: combined
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.all-in-one
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=combined
          cache-to: type=gha,mode=max,scope=combined

      - name: Attest combined image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.COMBINED_IMAGE }}
          subject-digest: ${{ steps.combined.outputs.digest }}
          push-to-registry: true

      - name: Promote images to latest
        env:
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          RELAY_DIGEST: ${{ steps.relay.outputs.digest }}
          COMBINED_DIGEST: ${{ steps.combined.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$FRONTEND_IMAGE:latest" "$FRONTEND_IMAGE@$FRONTEND_DIGEST"
          docker buildx imagetools create --tag "$RELAY_IMAGE:latest" "$RELAY_IMAGE@$RELAY_DIGEST"
          docker buildx imagetools create --tag "$COMBINED_IMAGE:latest" "$COMBINED_IMAGE@$COMBINED_DIGEST"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes
